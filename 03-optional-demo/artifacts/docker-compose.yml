services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: microservices
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  auth:
    build: ./services/auth-service
    environment:
      PORT: 8081
      DATABASE_URL: postgres://app:app@postgres:5432/microservices
      REDIS_URL: redis://redis:6379
    ports: ["8081:8081"]
    depends_on: [postgres, redis]

  orders:
    build: ./services/orders-service
    environment:
      PORT: 8082
      DATABASE_URL: postgres://app:app@postgres:5432/microservices
      REDIS_URL: redis://redis:6379
      NOTIFICATIONS_URL: http://notifications:8083
    ports: ["8082:8082"]
    depends_on: [postgres, redis, notifications]

  notifications:
    build: ./services/notifications-service
    environment:
      PORT: 8083
    ports: ["8083:8083"]
