version: 0.2

phases:
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
  build:
    commands:
      - |
        for SERVICE in auth orders notifications; do
          docker build -t "$REGISTRY/microservices-$SERVICE:$IMAGE_TAG" "services/$SERVICE-service"
          docker push "$REGISTRY/microservices-$SERVICE:$IMAGE_TAG"
        done
  post_build:
    commands:
      - printf '{"ImageURI":"%s"}' "$REGISTRY/microservices-orders:$IMAGE_TAG" > imageDetail.json
      - aws ecs describe-task-definition --task-definition microservices-orders --query taskDefinition > taskdef-raw.json
      - jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) | .containerDefinitions[0].image="<IMAGE1_NAME>"' taskdef-raw.json > taskdef.json
      - cp cicd/appspec.yaml appspec.yaml

artifacts:
  files:
    - imageDetail.json
    - taskdef.json
    - appspec.yaml
